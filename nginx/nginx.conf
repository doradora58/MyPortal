events{
    
}
http{
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name portal.doradora58.com;

        location / {
            root /usr/share/nginx/my-portal;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /bbs/ {
            root /usr/share/nginx;
            index index.html;
            try_files $uri $uri/ /bbs/index.html;
        }
        
        location /sample/ {
            root /usr/share/nginx;
            index index.html;
            try_files $uri $uri/ /sample/index.html;
        }

        location = /gantt-chart {
            return 301 /gantt-chart/;
        }

        location /gantt-chart/ {
            root /usr/share/nginx;
            index index.html;
            try_files $uri $uri/ /gantt-chart/index.html;
        }

        location /gantt-api/ {
            resolver 127.0.0.11 valid=10s;
            set $gantt_api gantt-api:8080;
            rewrite ^/gantt-api/(.*)$ /$1 break;
            proxy_pass http://$gantt_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
