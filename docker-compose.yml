name: MyPortal

services:
  my-portal-builder:
    build:
      context: ./frontend/my-portal
    image: my-portal-builder:latest
    container_name: my-portal-builder
    volumes:
      - portal-build:/usr/share/nginx/my-portal 
    command: sh -c "cd /app && npm install && rm -rf /usr/share/nginx/my-portal/* && npm run build && cp -r build/* /usr/share/nginx/my-portal && chmod -R 755 /usr/share/nginx/my-portal"

  bbs-builder:
    build:
      context: ./frontend/bbs
      dockerfile: Dockerfile
    image: bbs-builder:latest
    container_name: bbs-builder
    volumes:
      - bbs-build:/usr/share/nginx/bbs
    command: sh -c "cd /app && npm install && rm -rf /usr/share/nginx/bbs/* && npm run build && cp -r dist/* /usr/share/nginx/bbs && chmod -R 755 /usr/share/nginx/bbs"
 
  sample-builder:
    build:
      context: ./frontend/sample
      dockerfile: Dockerfile
    image: sample-builder:latest
    container_name: sample-builder
    volumes:
      - sample-build:/usr/share/nginx/sample
    command: sh -c "cd /app && npm install && rm -rf /usr/share/nginx/sample/* && npm run build && cp -r dist/* /usr/share/nginx/sample && chmod -R 755 /usr/share/nginx/sample"

  gantt-builder:
    build:
      context: ./frontend/gantt-chart
    image: gantt-builder:latest
    container_name: gantt-builder
    volumes:
      - gantt-chart-build:/usr/share/nginx/gantt-chart
    command: sh -c "rm -rf /usr/share/nginx/gantt-chart/* && cp -r /app/dist/* /usr/share/nginx/gantt-chart/ && chmod -R 755 /usr/share/nginx/gantt-chart"

  gantt-api:
    build:
      context: ./backend/TaskManager
    image: gantt-api:latest
    container_name: gantt-api
    environment:
      TASKS_FILE: /data/tasks.json
    volumes:
      - gantt-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf 
      - portal-build:/usr/share/nginx/my-portal:ro
      - bbs-build:/usr/share/nginx/bbs:ro
      - sample-build:/usr/share/nginx/sample:ro
      - gantt-chart-build:/usr/share/nginx/gantt-chart:ro
    depends_on:
      my-portal-builder:
        condition: service_completed_successfully
      bbs-builder:
        condition: service_completed_successfully
      sample-builder:
        condition: service_completed_successfully
      gantt-builder:
        condition: service_completed_successfully
      gantt-api:
        condition: service_started

volumes:
  portal-build:
  bbs-build:
  sample-build:
  gantt-chart-build:
  gantt-data: